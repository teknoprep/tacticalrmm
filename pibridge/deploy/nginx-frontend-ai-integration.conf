    location = /ai-integration/ui-config {
        # The API app speaks uwsgi, not HTTP -- proxy_pass to this socket gets
        # "upstream prematurely closed connection".
        uwsgi_pass  tacticalrmm;
        include     /etc/nginx/uwsgi_params;
        uwsgi_param PATH_INFO /core/ai/odoo/ui-config/;
        uwsgi_param SCRIPT_NAME "";
        add_header Cache-Control "no-store" always;
    }
    location ^~ /ai-integration/ {
        alias /opt/pi-trmm-bridge/ai-integration/;
        try_files $uri $uri/ /ai-integration/index.html;

        # Only Odoo may embed this. frame-ancestors is the directive that is
        # actually enforced; X-Frame-Options cannot express a specific origin
        # reliably and is present only for very old browsers.
        add_header Content-Security-Policy "frame-ancestors https://erp.blueuc.com" always;
        add_header X-Frame-Options "ALLOW-FROM https://erp.blueuc.com" always;
        # The URL must never leak into a downstream Referer header or log.
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }
